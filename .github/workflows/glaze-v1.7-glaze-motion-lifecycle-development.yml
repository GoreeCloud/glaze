name: Glaze UI V1.7 Glaze Motion Lifecycle Development
on:
  pull_request:
    paths:
      - 'GLAZE_UI_V1_7_PLANNED.md'
      - 'GLAZE_MOTION.md'
      - 'contracts/v1.7/glaze-motion-lifecycle.dev.json'
      - 'schemas/v1.7-glaze-motion-lifecycle.schema.json'
      - 'tokens/glaze-v1.7-glaze-motion-lifecycle.dev.json'
      - 'tokens/glaze-motion.json'
      - 'js/glaze-v1.7-glaze-motion-lifecycle.dev.mjs'
      - 'js/glaze-v1.7-motion-performance.dev.mjs'
      - 'js/glaze-v1.7-development.mjs'
      - 'scripts/validate_glaze_v1_7_glaze_motion_lifecycle_development.mjs'
      - 'scripts/validate_glaze_motion.py'
      - 'docs/development/v1.7-glaze-motion-lifecycle-reconciliation-20260926.md'
      - '.github/workflows/glaze-v1.7-glaze-motion-lifecycle-development.yml'
      - 'consumers/registry.json'
      - 'PLANNED-FEATURES.md'
      - 'IMPLEMENTED-FEATURES.md'
      - 'CHANGELOGS.md'
      - 'VERSION'
      - 'registry/lifecycle.json'
  push:
    branches: [main]
    paths:
      - 'GLAZE_UI_V1_7_PLANNED.md'
      - 'GLAZE_MOTION.md'
      - 'contracts/v1.7/glaze-motion-lifecycle.dev.json'
      - 'schemas/v1.7-glaze-motion-lifecycle.schema.json'
      - 'tokens/glaze-v1.7-glaze-motion-lifecycle.dev.json'
      - 'tokens/glaze-motion.json'
      - 'js/glaze-v1.7-glaze-motion-lifecycle.dev.mjs'
      - 'js/glaze-v1.7-motion-performance.dev.mjs'
      - 'js/glaze-v1.7-development.mjs'
      - 'scripts/validate_glaze_v1_7_glaze_motion_lifecycle_development.mjs'
      - 'scripts/validate_glaze_motion.py'
      - 'docs/development/v1.7-glaze-motion-lifecycle-reconciliation-20260926.md'
      - '.github/workflows/glaze-v1.7-glaze-motion-lifecycle-development.yml'
      - 'consumers/registry.json'
      - 'PLANNED-FEATURES.md'
      - 'IMPLEMENTED-FEATURES.md'
      - 'CHANGELOGS.md'
      - 'VERSION'
      - 'registry/lifecycle.json'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: glaze-v1-7-glaze-motion-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  glaze-motion-lifecycle-development:
    name: Validate V1.7 Glaze Motion Lifecycle Development reconciliation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Validate JSON and JavaScript syntax
        run: |
          python -m json.tool contracts/v1.7/glaze-motion-lifecycle.dev.json >/dev/null
          python -m json.tool schemas/v1.7-glaze-motion-lifecycle.schema.json >/dev/null
          python -m json.tool tokens/glaze-v1.7-glaze-motion-lifecycle.dev.json >/dev/null
          node --check js/glaze-v1.7-glaze-motion-lifecycle.dev.mjs
          node --check js/glaze-v1.7-development.mjs
          node --check scripts/validate_glaze_v1_7_glaze_motion_lifecycle_development.mjs
          python -m py_compile scripts/validate_glaze_motion.py
      - name: Verify retired 0.6 evidence provenance
        run: |
          git cat-file -e 974c6043281db1497973ef2b5ebc149440cd476b:acceptance/glaze-motion-0.6-experimental.md
          if git cat-file -e HEAD:acceptance/glaze-motion-0.6-experimental.md 2>/dev/null; then
            echo "Retired 0.6 acceptance record unexpectedly restored to current tree" >&2
            exit 1
          fi
          git show 974c6043281db1497973ef2b5ebc149440cd476b:acceptance/glaze-motion-0.6-experimental.md | grep -F "This evidence remains insufficient for Candidate promotion."
      - name: Validate current Glaze Motion governance
        run: python scripts/validate_glaze_motion.py
      - name: Validate V1.7 Section 34 reconciliation
        run: node scripts/validate_glaze_v1_7_glaze_motion_lifecycle_development.mjs

  v1-7-regression:
    name: Preserve V1.7 dev.1-dev.25 foundations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Verify prior V1.7 Development foundations
        run: |
          node scripts/validate_glaze_v1_7_task_continuity_development.mjs
          node scripts/validate_glaze_v1_7_adaptive_input_development.mjs
          node scripts/validate_glaze_v1_7_form_factor_profiles_development.mjs
          node scripts/validate_glaze_v1_7_command_surface_development.mjs
          node scripts/validate_glaze_v1_7_personalization_development.mjs
          node scripts/validate_glaze_v1_7_system_shell_continuity_development.mjs
          node scripts/validate_glaze_v1_7_notification_activity_surfaces_development.mjs
          node scripts/validate_glaze_v1_7_theme_semantic_color_development.mjs
          node scripts/validate_glaze_v1_7_native_glaze_kits_development.mjs
          node scripts/validate_glaze_v1_7_expanded_component_system_development.mjs
          node scripts/validate_glaze_v1_7_inspector_development.mjs
          node scripts/validate_glaze_v1_7_studio_development.mjs
          node scripts/validate_glaze_v1_7_continuity_aware_motion_development.mjs
          node scripts/validate_glaze_v1_7_signature_motion_system_development.mjs
          node scripts/validate_glaze_v1_7_signature_motion_principles_development.mjs
          node scripts/validate_glaze_v1_7_signature_transition_families_development.mjs
          node scripts/validate_glaze_v1_7_connected_transformation_2_development.mjs
          node scripts/validate_glaze_v1_7_adaptive_composition_motion_development.mjs
          node scripts/validate_glaze_v1_7_signature_microinteractions_development.mjs
          node scripts/validate_glaze_v1_7_theme_transition_system_development.mjs
          node scripts/validate_glaze_v1_7_motion_expression_profiles_development.mjs
          node scripts/validate_glaze_v1_7_motion_personalization_development.mjs
          node scripts/validate_glaze_v1_7_reduced_motion_equivalents_development.mjs
          node scripts/validate_glaze_v1_7_motion_fatigue_protection_development.mjs
          node scripts/validate_glaze_v1_7_motion_performance_development.mjs

  experimental-glaze-motion-boundary:
    name: Preserve separate Glaze Motion Experimental lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Validate current Experimental governance
        run: python scripts/validate_glaze_motion.py
      - name: Run retained Glaze Motion runtime/accessibility/interaction tests
        run: node --test tests/glaze-motion-runtime.test.mjs tests/glaze-motion-accessibility.test.mjs tests/glaze-motion-interaction.test.mjs tests/glaze-motion-consumer.test.mjs

  v1-6-anchor-authority:
    name: Preserve GLAZE UI V1.6 Anchor authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - run: node scripts/verify_glaze_v1_6_stable_qualification_review.mjs
      - run: node scripts/verify_glaze_v1_6_stable.mjs
