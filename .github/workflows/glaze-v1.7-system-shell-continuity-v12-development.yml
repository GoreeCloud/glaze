name: Glaze UI V1.7 System Shell Continuity v1.2 Development
on:
  pull_request:
    paths:
      - 'GLAZE_UI_V1_7_PLANNED.md'
      - 'contracts/v1.7/system-shell-continuity-v12.dev.json'
      - 'schemas/v1.7-system-shell-continuity-v12.schema.json'
      - 'tokens/glaze-v1.7-system-shell-continuity-v12.dev.json'
      - 'js/glaze-v1.7-system-shell-continuity-v12.dev.mjs'
      - 'js/glaze-v1.7-system-shell-continuity.dev.mjs'
      - 'js/glaze-v1.7-signature-transition-families.dev.mjs'
      - 'js/glaze-v1.7-reduced-motion-equivalents.dev.mjs'
      - 'js/glaze-v1.7-motion-fatigue-protection.dev.mjs'
      - 'js/glaze-v1.7-motion-performance.dev.mjs'
      - 'js/glaze-v1.7-glaze-motion-lifecycle.dev.mjs'
      - 'js/glaze-v1.7-development.mjs'
      - 'scripts/validate_glaze_v1_7_system_shell_continuity_v12_development.mjs'
      - 'scripts/validate_glaze_v1_7_system_shell_continuity_development.mjs'
      - 'docs/development/v1.7-system-shell-continuity-v12-open-source-research-20260926.md'
      - '.github/workflows/glaze-v1.7-system-shell-continuity-v12-development.yml'
      - 'PLANNED-FEATURES.md'
      - 'IMPLEMENTED-FEATURES.md'
      - 'CHANGELOGS.md'
      - 'VERSION'
      - 'registry/lifecycle.json'
  push:
    branches: [main]
    paths:
      - 'GLAZE_UI_V1_7_PLANNED.md'
      - 'contracts/v1.7/system-shell-continuity-v12.dev.json'
      - 'schemas/v1.7-system-shell-continuity-v12.schema.json'
      - 'tokens/glaze-v1.7-system-shell-continuity-v12.dev.json'
      - 'js/glaze-v1.7-system-shell-continuity-v12.dev.mjs'
      - 'js/glaze-v1.7-system-shell-continuity.dev.mjs'
      - 'js/glaze-v1.7-signature-transition-families.dev.mjs'
      - 'js/glaze-v1.7-reduced-motion-equivalents.dev.mjs'
      - 'js/glaze-v1.7-motion-fatigue-protection.dev.mjs'
      - 'js/glaze-v1.7-motion-performance.dev.mjs'
      - 'js/glaze-v1.7-glaze-motion-lifecycle.dev.mjs'
      - 'js/glaze-v1.7-development.mjs'
      - 'scripts/validate_glaze_v1_7_system_shell_continuity_v12_development.mjs'
      - 'scripts/validate_glaze_v1_7_system_shell_continuity_development.mjs'
      - 'docs/development/v1.7-system-shell-continuity-v12-open-source-research-20260926.md'
      - '.github/workflows/glaze-v1.7-system-shell-continuity-v12-development.yml'
      - 'PLANNED-FEATURES.md'
      - 'IMPLEMENTED-FEATURES.md'
      - 'CHANGELOGS.md'
      - 'VERSION'
      - 'registry/lifecycle.json'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: glaze-v1-7-system-shell-v12-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  system-shell-v12-development:
    name: Validate V1.7 System Shell Continuity v1.2 dev.27
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Validate JSON and JavaScript syntax
        run: |
          python -m json.tool contracts/v1.7/system-shell-continuity-v12.dev.json >/dev/null
          python -m json.tool schemas/v1.7-system-shell-continuity-v12.schema.json >/dev/null
          python -m json.tool tokens/glaze-v1.7-system-shell-continuity-v12.dev.json >/dev/null
          node --check js/glaze-v1.7-system-shell-continuity-v12.dev.mjs
          node --check js/glaze-v1.7-development.mjs
          node --check scripts/validate_glaze_v1_7_system_shell_continuity_v12_development.mjs
      - name: Validate Section 35 source reconciliation
        run: node scripts/validate_glaze_v1_7_system_shell_continuity_v12_development.mjs

  historical-shell-regression:
    name: Preserve historical V1.7 System Shell dev.6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - run: node scripts/validate_glaze_v1_7_system_shell_continuity_development.mjs

  signature-motion-stack-regression:
    name: Preserve V1.7 semantic motion dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - run: node scripts/validate_glaze_v1_7_signature_transition_families_development.mjs
      - run: node scripts/validate_glaze_v1_7_reduced_motion_equivalents_development.mjs
      - run: node scripts/validate_glaze_v1_7_motion_fatigue_protection_development.mjs
      - run: node scripts/validate_glaze_v1_7_motion_performance_development.mjs
      - run: node scripts/validate_glaze_v1_7_glaze_motion_lifecycle_development.mjs

  v1-6-anchor-authority:
    name: Preserve GLAZE UI V1.6 Anchor authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - run: node scripts/verify_glaze_v1_6_stable_qualification_review.mjs
      - run: node scripts/verify_glaze_v1_6_stable.mjs
