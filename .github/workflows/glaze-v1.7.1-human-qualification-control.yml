name: Glaze V1.7.1 Human Qualification Control

on:
  pull_request:
    paths:
      - 'contracts/v1.7/qualification.v1.2.human.plan.json'
      - 'schemas/v1.7.1-human-qualification-plan.schema.json'
      - 'reference/v1.7/human-qualification.html'
      - 'scripts/prepare_glaze_v1_7_1_human_qualification.py'
      - 'scripts/validate_glaze_v1_7_1_human_qualification_plan.mjs'
      - 'acceptance/v1.7-development.md'
      - 'GLAZE_V1_7_1_HARDENING.md'
      - 'IMPLEMENTED-FEATURES.md'
      - 'CHANGELOGS.md'
      - '.github/workflows/glaze-v1.7.1-human-qualification-control.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-7-1-human-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V171_SOURCE_SHA: 4b9d085a5177b96cc31d4270b38d792a59872e37

jobs:
  verify-human-qualification-control:
    name: Verify V1.7.1 human qualification control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tooling revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact tooling revision and frozen source availability
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "${V171_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$V171_SOURCE_SHA" HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Syntax-check human review tooling
        run: |
          python -m json.tool contracts/v1.7/qualification.v1.2.human.plan.json >/dev/null
          python -m json.tool schemas/v1.7.1-human-qualification-plan.schema.json >/dev/null
          node --check scripts/validate_glaze_v1_7_1_human_qualification_plan.mjs
          python -m py_compile scripts/prepare_glaze_v1_7_1_human_qualification.py
      - name: Validate human review control and fail-closed boundaries
        run: node scripts/validate_glaze_v1_7_1_human_qualification_plan.mjs
      - name: Prepare exact-source review root as a structural smoke test
        run: |
          python scripts/prepare_glaze_v1_7_1_human_qualification.py --out _v171-human-control-smoke
          test -f _v171-human-control-smoke/qualification-source.json
          test -f _v171-human-control-smoke/js/glaze-v1.7-development-v1-3.dev.mjs
          test -f _v171-human-control-smoke/reference/v1.7/human-qualification.html
          test -f _v171-human-control-smoke/reference/v1.7/rendered-v1.2-qualification.html
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('_v171-human-control-smoke/qualification-source.json').read_text())
          assert data['sourceRevision']=='4b9d085a5177b96cc31d4270b38d792a59872e37'
          assert data['sourceModelVersion']=='1.7.0-dev.47'
          assert data['acceptanceModelVersion']=='1.7.0-dev.39'
          assert data['stableBaseline']=='1.7.0'
          assert data['historicalSourceStableBaseline']=='1.6.0'
          assert data['humanEvidenceClaimed'] is False
          assert data['assistiveTechnologyEvidenceClaimed'] is False
          assert data['deviceEvidenceClaimed'] is False
          assert data['performanceEvidenceClaimed'] is False
          assert data['energyEvidenceClaimed'] is False
          assert data['section48Accepted'] is False
          assert data['v171AcceptanceClaimed'] is False
          print('Exact-source V1.7.1 human-review preparation smoke test: PASS')
          PY
      - name: Preserve V1.7 input, motion, privacy, and continuity boundaries
        run: |
          node scripts/validate_glaze_v1_7_adaptive_input_development.mjs
          node scripts/validate_glaze_v1_7_signature_motion_system_development.mjs
          node scripts/validate_glaze_v1_7_privacy_authority_boundaries_development.mjs
          node scripts/validate_glaze_v1_7_task_continuity_development.mjs
      - name: Preserve retained acceptance-control behavior
        run: node scripts/validate_glaze_v1_7_acceptance_development.mjs
      - name: Preserve bounded V1.7 Stable authority
        run: node scripts/verify_glaze_v1_7_stable.mjs
      - name: Verify validation did not mutate tracked source
        run: git diff --exit-code -- .
