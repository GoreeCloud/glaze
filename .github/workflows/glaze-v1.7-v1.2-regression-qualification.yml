name: Glaze V1.7.1 Retained V1.2 Rendered Regression Qualification

on:
  pull_request:
    paths:
      - 'contracts/v1.7/qualification.v1.2.regression.plan.json'
      - 'scripts/compare_glaze_v1_7_v1_2_rendered_regression.py'
      - 'scripts/validate_glaze_v1_7_v1_2_regression_qualification_plan.mjs'
      - 'docs/v1.7/v1.2-regression-qualification-dev47.contract.json'
      - 'docs/v1.7/V1_2_EXTERNAL_QUALIFICATION_COLLECTION.md'
      - '.github/workflows/glaze-v1.7-v1.2-regression-qualification.yml'
      - 'CHANGELOGS.md'
      - 'IMPLEMENTED-FEATURES.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V17_SOURCE_SHA: 4b9d085a5177b96cc31d4270b38d792a59872e37
  PRIOR_RUN_ID: '37144536213'
  PRIOR_ARTIFACT_ID: '11281038583'
  PRIOR_ARTIFACT_NAME: glaze-v1.7-v1.2-rendered-browser-37144536213
  PRIOR_ARTIFACT_DIGEST: sha256:9b862d7da7d5aaf389507f9005edcdf141095593c8c4b30c26ff354e46da5018

jobs:
  verify-regression-control:
    name: Verify retained V1.2 regression control plane
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate regression tooling
        run: |
          python -m json.tool contracts/v1.7/qualification.v1.2.regression.plan.json >/dev/null
          python -m py_compile scripts/compare_glaze_v1_7_v1_2_rendered_regression.py
          node --check scripts/validate_glaze_v1_7_v1_2_regression_qualification_plan.mjs
          node scripts/validate_glaze_v1_7_v1_2_regression_qualification_plan.mjs
          node scripts/validate_glaze_v1_7_v1_2_rendered_qualification_harness.mjs
          node scripts/validate_glaze_v1_7_acceptance_development.mjs
          node scripts/verify_glaze_v1_7_stable.mjs
          node scripts/verify_glaze_v1_6_stable_qualification_review.mjs
      - run: git diff --exit-code -- .

  compare-rendered-regression:
    name: Compare frozen-source retained V1.2 rendered regression
    needs: verify-regression-control
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.V17_SOURCE_SHA }}
          path: _v17-source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify prior rendered artifact metadata
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PRIOR_ARTIFACT_ID" -o prior-artifact.json
          test "$(jq -r '.id' prior-artifact.json)" = "$PRIOR_ARTIFACT_ID"
          test "$(jq -r '.name' prior-artifact.json)" = "$PRIOR_ARTIFACT_NAME"
          test "$(jq -r '.digest' prior-artifact.json)" = "$PRIOR_ARTIFACT_DIGEST"
          test "$(jq -r '.expired' prior-artifact.json)" = "false"
          test "$(jq -r '.workflow_run.id' prior-artifact.json)" = "$PRIOR_RUN_ID"
      - name: Download prior exact-source rendered evidence
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PRIOR_ARTIFACT_ID/zip" -o prior.zip
          rm -rf _prior && mkdir _prior
          unzip -q prior.zip -d _prior
          test -f _prior/manifest.json
      - name: Assemble repository-local render root
        run: |
          set -euo pipefail
          rm -rf _v17-render-root
          mkdir -p _v17-render-root/reference/v1.7
          cp -a _v17-source/js _v17-render-root/js
          cp -a _v17-source/css _v17-render-root/css
          cp reference/v1.7/rendered-v1.2-qualification.html _v17-render-root/reference/v1.7/
          cp reference/v1.7/rendered-v1.2-qualification.mjs _v17-render-root/reference/v1.7/
          cp reference/v1.7/rendered-v1.2-qualification-shared.mjs _v17-render-root/reference/v1.7/
          cp reference/v1.7/rendered-v1.2-scenes-*.mjs _v17-render-root/reference/v1.7/
      - name: Capture first fresh exact-source render
        run: |
          rm -rf artifacts/v1.7-v1.2-regression
          python scripts/capture_glaze_v1_7_v1_2_rendered_qualification.py             --render-root _v17-render-root --source-root _v17-source --tooling-root .             --out artifacts/v1.7-v1.2-regression/fresh-a
      - name: Capture second fresh exact-source render
        run: |
          python scripts/capture_glaze_v1_7_v1_2_rendered_qualification.py             --render-root _v17-render-root --source-root _v17-source --tooling-root .             --out artifacts/v1.7-v1.2-regression/fresh-b
      - name: Compare semantic baseline and fresh pixels
        run: |
          python scripts/compare_glaze_v1_7_v1_2_rendered_regression.py             --prior _prior             --fresh-a artifacts/v1.7-v1.2-regression/fresh-a             --fresh-b artifacts/v1.7-v1.2-regression/fresh-b             --out artifacts/v1.7-v1.2-regression/result
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/v1.7-v1.2-regression/result')
          result=json.loads((root/'regression-result.json').read_text())
          evidence=json.loads((root/'regression-evidence.json').read_text())
          manifest=json.loads((root/'manifest.json').read_text())
          assert result['passed'] is True
          assert result['semanticBaselineMatched'] is True
          assert result['freshVisualRepeatabilityMatched'] is True
          assert result['pixelTolerance']==0
          assert result['stableBaseline']=='1.7.0'
          assert result['historicalSourceStableBaseline']=='1.6.0'
          assert len(evidence)==1 and evidence[0]['id']=='regression'
          assert evidence[0]['evidenceType']=='rendered'
          assert evidence[0]['revision']=='4b9d085a5177b96cc31d4270b38d792a59872e37'
          assert manifest['passed'] is True
          assert manifest['authority']['renderedRegressionOnly'] is True
          assert manifest['authority']['anchorStatusGranted'] is False
          assert manifest['authority']['v171AcceptanceClaimed'] is False
          assert manifest['authority']['section48Accepted'] is False
          print('V1.7.1 retained rendered Regression evidence verification: PASS')
          PY
      - name: Preserve exact source and tooling cleanliness
        run: |
          git -C _v17-source diff --exit-code -- .
          git diff --exit-code -- .
      - name: Upload retained V1.2 regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: glaze-v1.7-v1.2-rendered-regression-${{ github.run_id }}
          path: artifacts/v1.7-v1.2-regression/
          if-no-files-found: error
          retention-days: 90
