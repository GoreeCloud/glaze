name: Glaze V1.7 Section 48 Qualification Development

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1.7-section48-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  section48-qualification:
    name: Validate V1.7 dev.43 Section 48 qualification control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Validate dev.43 qualification control
        run: |
          python -m json.tool docs/v1.7/section48-qualification-dev43.contract.json >/dev/null
          python -m json.tool acceptance/v1.7-v1.3-qualification-evidence.template.json >/dev/null
          node --check js/glaze-v1.7-section48-qualification.dev.mjs
          node --check js/glaze-v1.7-development-v1-3.dev.mjs
          node --check scripts/validate_glaze_v1_7_section48_qualification_dev43.mjs
          node scripts/validate_glaze_v1_7_section48_qualification_dev43.mjs
      - name: Verify validation did not mutate tracked source
        run: git diff --exit-code -- .

  retained-v1-7-boundaries:
    name: Preserve dev.39 through dev.42 boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node scripts/validate_glaze_v1_7_acceptance_development.mjs
      - run: node scripts/validate_glaze_v1_7_expression_core_dev40.mjs
      - run: node scripts/validate_glaze_v1_7_provider_adaptive_surfaces_dev41.mjs
      - run: node scripts/validate_glaze_v1_7_adaptive_experience_surfaces_dev42.mjs
      - name: Verify retained-boundary validation did not mutate tracked source
        run: git diff --exit-code -- .

  v1-6-anchor:
    name: Preserve Glaze UI V1.6 Anchor authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node scripts/verify_glaze_v1_6_stable_qualification_review.mjs
      - run: node scripts/verify_glaze_v1_6_stable.mjs
      - name: Verify V1.6 Anchor validation did not mutate tracked source
        run: git diff --exit-code -- .
