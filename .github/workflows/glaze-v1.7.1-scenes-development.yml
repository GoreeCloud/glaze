name: Glaze 1.7.1 Experience Scenes Development
on:
  pull_request:
    paths:
      - 'reference/v1.7.1/visual-evolution-scenes.html'
      - 'css/glaze-v1.7.1-scenes*.css'
      - 'js/glaze-v1.7.1-scenes.development.mjs'
      - 'scripts/verify_glaze_v171_scenes.mjs'
      - 'scripts/qa_glaze_v171_scenes_browser.cjs'
      - 'docs/v1.7.1/visual-evolution-scenes.md'
      - '.github/workflows/glaze-v1.7.1-scenes-development.yml'
  push:
    branches: [main]
    paths:
      - 'reference/v1.7.1/visual-evolution-scenes.html'
      - 'css/glaze-v1.7.1-scenes*.css'
      - 'js/glaze-v1.7.1-scenes.development.mjs'
      - 'scripts/verify_glaze_v171_scenes.mjs'
      - 'scripts/qa_glaze_v171_scenes_browser.cjs'
      - 'docs/v1.7.1/visual-evolution-scenes.md'
      - '.github/workflows/glaze-v1.7.1-scenes-development.yml'
permissions:
  contents: read
jobs:
  scenes-source:
    name: development-scene-source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify visual foundation
        run: node scripts/verify_glaze_v171_visual_evolution.mjs
      - name: Verify application scenes and Stable isolation
        run: node scripts/verify_glaze_v171_scenes.mjs
      - name: Check browser harness JavaScript syntax
        run: node --check scripts/qa_glaze_v171_scenes_browser.cjs
      - name: Verify checkout remains unchanged
        run: git diff --exit-code -- .
      - name: Record qualification boundary
        run: echo "Source checks only; browser, human, native, AT, performance, energy and consumer approval are independent"
