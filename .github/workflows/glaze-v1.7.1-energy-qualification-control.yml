name: Glaze V1.7.1 Energy Qualification Control
on:
  pull_request:
    paths:
      - 'contracts/v1.7/qualification.v1.2.energy.plan.json'
      - 'schemas/v1.7.1-energy-qualification-plan.schema.json'
      - 'docs/v1.7/V1_7_1_ENERGY_QUALIFICATION.md'
      - 'scripts/validate_glaze_v1_7_1_energy_qualification.py'
      - '.github/workflows/glaze-v1.7.1-energy-qualification-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-energy-control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m json.tool contracts/v1.7/qualification.v1.2.energy.plan.json >/dev/null
          python -m json.tool schemas/v1.7.1-energy-qualification-plan.schema.json >/dev/null
          python scripts/validate_glaze_v1_7_1_energy_qualification.py
          node scripts/validate_glaze_v1_7_performance_energy_awareness_development.mjs
          node scripts/validate_glaze_v1_7_acceptance_development.mjs
          node scripts/verify_glaze_v1_7_stable.mjs
          git diff --exit-code -- .
