      - 'assets/icon-glyphs/system-symbols.svg'
      - 'reference/v1.7.1/visual-evolution-scenes.html'
      - 'css/glaze-v1.7.1-scenes*.css'
      - 'css/glaze-v1.7.1-density.development.css'
      - 'js/glaze-v1.7.1-density.development.mjs'
      - 'js/glaze-v1.7.1-glyph-lab.development.mjs'
