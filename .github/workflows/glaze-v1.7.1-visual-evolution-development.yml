name: Glaze V1.7.1 Visual Evolution Development

on:
  pull_request:
    paths:
      - 'tokens/v1.7.1/visual-evolution.development.json'
      - 'css/glaze-v1.7.1-visual-evolution.development.css'
      - 'reference/v1.7.1/visual-evolution.html'
      - 'docs/v1.7.1/visual-evolution.md'
      - 'scripts/verify_glaze_v171_visual_evolution.mjs'
      - 'assets/icon-glyphs/system-symbols.svg'
      - '.github/workflows/glaze-v1.7.1-visual-evolution-development.yml'
  push:
    branches: [main]
    paths:
      - 'tokens/v1.7.1/visual-evolution.development.json'
      - 'css/glaze-v1.7.1-visual-evolution.development.css'
      - 'reference/v1.7.1/visual-evolution.html'
      - 'docs/v1.7.1/visual-evolution.md'
      - 'scripts/verify_glaze_v171_visual_evolution.mjs'
      - 'assets/icon-glyphs/system-symbols.svg'
      - '.github/workflows/glaze-v1.7.1-visual-evolution-development.yml'

permissions:
  contents: read

jobs:
  visual-evolution-source:
    name: v1.7.1-visual-evolution-source-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Verify development-only visual source
        run: node scripts/verify_glaze_v171_visual_evolution.mjs

      - name: Verify checkout remains unchanged
        run: git diff --exit-code -- .

      - name: Record qualification boundary
        run: echo "Structural/contrast check only. No rendered, assistive-technology, native, performance, security, privacy, consumer or Stable acceptance."
