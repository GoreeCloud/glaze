name: Glaze V1.7 v1.3 Qualification Development

on:
  pull_request:
    paths:
      - 'js/glaze-v1.7-v1-3-qualification.dev.mjs'
      - 'js/glaze-v1.7-development-v1-3.dev.mjs'
      - 'docs/v1.7/v1.3-qualification-dev46.contract.json'
      - 'scripts/validate_glaze_v1_7_v1_3_qualification_dev46.mjs'
      - 'scripts/validate_glaze_v1_7_section48_source_completion_dev45.mjs'
      - '.github/workflows/glaze-v1.7-v1.3-qualification-development.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v1-3-qualification:
    name: Validate V1.7 dev.46 combined qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Validate combined qualification control
        run: |
          python -m json.tool docs/v1.7/v1.3-qualification-dev46.contract.json >/dev/null
          node --check js/glaze-v1.7-v1-3-qualification.dev.mjs
          node --check scripts/validate_glaze_v1_7_v1_3_qualification_dev46.mjs
          node scripts/validate_glaze_v1_7_v1_3_qualification_dev46.mjs
          node scripts/validate_glaze_v1_7_acceptance_development.mjs
          node scripts/validate_glaze_v1_7_section48_source_completion_dev45.mjs
          node scripts/validate_glaze_v1_7_section48_qualification_evidence.mjs
      - run: git diff --exit-code -- .

  retained-boundaries:
    name: Preserve retained V1.7 authority boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node scripts/validate_glaze_v1_7_privacy_authority_boundaries_development.mjs
      - run: node scripts/validate_glaze_v1_7_accessibility_continuity_development.mjs
      - run: node scripts/validate_glaze_v1_7_performance_energy_awareness_development.mjs
      - run: git diff --exit-code -- .

  v1-6-anchor:
    name: Preserve GLAZE UI V1.6 Anchor authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node scripts/verify_glaze_v1_6_stable_qualification_review.mjs
      - run: node scripts/verify_glaze_v1_6_stable.mjs
      - run: git diff --exit-code -- .
