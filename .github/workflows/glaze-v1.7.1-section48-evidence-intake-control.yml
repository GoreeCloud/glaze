name: Glaze V1.7.1 Section 48 Evidence Intake Control

on:
  pull_request:
    paths:
      - 'contracts/v1.7/qualification.v1.3.evidence-intake.plan.json'
      - 'schemas/v1.7.1-section48-evidence-intake-plan.schema.json'
      - 'schemas/v1.7.1-section48-evidence-intake.schema.json'
      - 'acceptance/v1.7.1-section48-evidence-intake.template.json'
      - 'scripts/validate_glaze_v1_7_1_section48_evidence_intake.mjs'
      - 'contracts/v1.7/qualification.v1.3.control-coverage.json'
      - 'contracts/v1.7/qualification.v1.3.field.plan.json'
      - 'contracts/v1.7/qualification.v1.3.trust.plan.json'
      - 'acceptance/v1.7-development.md'
      - 'GLAZE_V1_7_1_HARDENING.md'
      - '.github/workflows/glaze-v1.7.1-section48-evidence-intake-control.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-7-1-section48-evidence-intake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V171_SOURCE_SHA: 4b9d085a5177b96cc31d4270b38d792a59872e37

jobs:
  verify-section48-evidence-intake:
    name: Verify V1.7.1 Section 48 evidence intake
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tooling revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tooling revision and frozen source availability
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "${V171_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$V171_SOURCE_SHA" HEAD

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Syntax-check intake artifacts
        run: |
          python -m json.tool contracts/v1.7/qualification.v1.3.evidence-intake.plan.json >/dev/null
          python -m json.tool schemas/v1.7.1-section48-evidence-intake-plan.schema.json >/dev/null
          python -m json.tool schemas/v1.7.1-section48-evidence-intake.schema.json >/dev/null
          python -m json.tool acceptance/v1.7.1-section48-evidence-intake.template.json >/dev/null
          node --check scripts/validate_glaze_v1_7_1_section48_evidence_intake.mjs

      - name: Validate governed Section 48 evidence intake
        run: node scripts/validate_glaze_v1_7_1_section48_evidence_intake.mjs

      - name: Preserve complete Section 48 control coverage
        run: node scripts/validate_glaze_v1_7_1_section48_control_coverage.mjs

      - name: Preserve field and trust collection boundaries
        run: |
          node scripts/validate_glaze_v1_7_1_section48_field_qualification.mjs --self-test
          python scripts/validate_glaze_v1_7_1_section48_trust_qualification.py --self-test

      - name: Preserve dev.47 combined qualification boundaries
        run: |
          node scripts/validate_glaze_v1_7_v1_3_qualification_dev46.mjs
          node scripts/validate_glaze_v1_7_v1_3_qualification_coverage_dev47.mjs

      - name: Preserve bounded V1.7 Stable authority
        run: node scripts/verify_glaze_v1_7_stable.mjs

      - name: Verify validation did not mutate tracked source
        run: git diff --exit-code -- .
