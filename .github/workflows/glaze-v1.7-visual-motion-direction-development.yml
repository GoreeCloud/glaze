name: Glaze UI V1.7 Visual and Motion Direction Development
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-motion-direction:
    name: Validate V1.7 Visual and Motion Direction source foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate Section 43 source foundation
        run: |
          python -m json.tool contracts/v1.7/visual-motion-direction.dev.json >/dev/null
          python -m json.tool schemas/v1.7-visual-motion-direction.schema.json >/dev/null
          python -m json.tool tokens/glaze-v1.7-visual-motion-direction.dev.json >/dev/null
          node --check js/glaze-v1.7-visual-motion-direction.dev.mjs
          node --check js/glaze-v1.7-development.mjs
          node --check scripts/validate_glaze_v1_7_visual_motion_direction_development.mjs
          node scripts/validate_glaze_v1_7_visual_motion_direction_development.mjs
  retained-direction-foundations:
    name: Preserve cross-device, accessibility, and motion constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: node scripts/validate_glaze_v1_7_cross_device_consistency_development.mjs
      - run: node scripts/validate_glaze_v1_7_accessibility_continuity_development.mjs
      - run: node scripts/validate_glaze_v1_7_motion_performance_development.mjs
      - run: node scripts/validate_glaze_v1_7_reduced_motion_equivalents_development.mjs
  v1-6-anchor:
    name: Preserve GLAZE UI V1.6 Anchor authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: node scripts/verify_glaze_v1_6_stable_qualification_review.mjs
      - run: node scripts/verify_glaze_v1_6_stable.mjs
