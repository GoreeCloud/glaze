name: Glaze V1.7.1 Section 48 Trust Qualification Control

on:
  pull_request:
    paths:
      - 'contracts/v1.7/qualification.v1.3.trust.plan.json'
      - 'schemas/v1.7.1-section48-trust-qualification-plan.schema.json'
      - 'acceptance/v1.7.1-section48-provider-integration-evidence.template.json'
      - 'acceptance/v1.7.1-section48-privacy-security-evidence.template.json'
      - 'acceptance/v1.7.1-section48-trust-qualification.md'
      - 'scripts/prepare_glaze_v1_7_1_section48_trust_qualification.py'
      - 'scripts/validate_glaze_v1_7_1_section48_trust_qualification.py'
      - 'acceptance/v1.7-development.md'
      - 'GLAZE_V1_7_1_HARDENING.md'
      - '.github/workflows/glaze-v1.7.1-section48-trust-qualification-control.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-7-1-section48-trust-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V171_SOURCE_SHA: 4b9d085a5177b96cc31d4270b38d792a59872e37

jobs:
  verify-section48-trust-qualification-control:
    name: Verify V1.7.1 Section 48 trust qualification control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tooling revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tooling revision and frozen source availability
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "${V171_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$V171_SOURCE_SHA" HEAD

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Syntax-check trust qualification tooling
        run: |
          python -m json.tool contracts/v1.7/qualification.v1.3.trust.plan.json >/dev/null
          python -m json.tool schemas/v1.7.1-section48-trust-qualification-plan.schema.json >/dev/null
          python -m json.tool acceptance/v1.7.1-section48-provider-integration-evidence.template.json >/dev/null
          python -m json.tool acceptance/v1.7.1-section48-privacy-security-evidence.template.json >/dev/null
          python -m py_compile scripts/prepare_glaze_v1_7_1_section48_trust_qualification.py
          python -m py_compile scripts/validate_glaze_v1_7_1_section48_trust_qualification.py

      - name: Validate trust qualification control and synthetic negative cases
        run: python scripts/validate_glaze_v1_7_1_section48_trust_qualification.py --self-test

      - name: Prepare exact-source trust review package as structural smoke test
        run: |
          python scripts/prepare_glaze_v1_7_1_section48_trust_qualification.py --out _v171-section48-trust-control-smoke
          test -f _v171-section48-trust-control-smoke/qualification-source.json
          test -f _v171-section48-trust-control-smoke/js/glaze-v1.7-development-v1-3.dev.mjs
          test -f _v171-section48-trust-control-smoke/contracts/v1.7/qualification.v1.3.trust.plan.json
          test -f _v171-section48-trust-control-smoke/acceptance/v1.7.1-section48-trust-qualification.md
          test -f _v171-section48-trust-control-smoke/acceptance/v1.7.1-section48-provider-integration-evidence.template.json
          test -f _v171-section48-trust-control-smoke/acceptance/v1.7.1-section48-privacy-security-evidence.template.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('_v171-section48-trust-control-smoke/qualification-source.json').read_text())
          assert data['sourceRevision']=='4b9d085a5177b96cc31d4270b38d792a59872e37'
          assert data['sourceModelVersion']=='1.7.0-dev.47'
          assert data['section48QualificationModelVersion']=='1.7.0-dev.47'
          assert data['stableBaseline']=='1.7.0'
          assert data['historicalSourceStableBaseline']=='1.6.0'
          assert data['targetEvidenceTypes']==['provider-integration','privacy-security']
          assert data['manualIntegrationSessionPerformed'] is False
          assert data['providerIntegrationEvidenceClaimed'] is False
          assert data['privacySecurityEvidenceClaimed'] is False
          assert data['credentialsOrReusableSecretsIncluded'] is False
          assert data['unnecessaryPrivatePayloadIncluded'] is False
          assert data['section48Accepted'] is False
          assert data['v171AcceptanceClaimed'] is False
          print('Exact-source V1.7.1 Section 48 trust review-package smoke test: PASS')
          PY

      - name: Preserve Section 48 provider and privacy source boundaries
        run: |
          node scripts/validate_glaze_v1_7_provider_adaptive_surfaces_dev41.mjs
          node scripts/validate_glaze_v1_7_privacy_authority_boundaries_development.mjs
          node scripts/validate_glaze_v1_7_section48_source_completion_dev45.mjs
          node scripts/validate_glaze_v1_7_v1_3_qualification_dev46.mjs
          node scripts/validate_glaze_v1_7_v1_3_qualification_coverage_dev47.mjs

      - name: Preserve bounded V1.7 Stable authority
        run: node scripts/verify_glaze_v1_7_stable.mjs

      - name: Verify validation did not mutate tracked source
        run: git diff --exit-code -- .
