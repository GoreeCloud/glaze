name: Glaze V1.7.1 Development Boundary

on:
  pull_request:
    paths:
      - 'js/glaze-v1.7.1-development.mjs'
      - 'js/glaze-v1.7-development-v1-3.dev.mjs'
      - 'js/icon-glyph-registry.mjs'
      - 'js/glaze-v1.7.0.mjs'
      - 'scripts/verify_glaze_v1_7_1_development_boundary.mjs'
      - '.github/workflows/glaze-v1.7.1-development-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'js/glaze-v1.7.1-development.mjs'
      - 'js/glaze-v1.7-development-v1-3.dev.mjs'
      - 'js/icon-glyph-registry.mjs'
      - 'js/glaze-v1.7.0.mjs'
      - 'scripts/verify_glaze_v1_7_1_development_boundary.mjs'
      - '.github/workflows/glaze-v1.7.1-development-boundary.yml'

permissions:
  contents: read

jobs:
  development-boundary:
    name: v1.7.1-development-authority-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Verify V1.7.1 Development isolation and export identity
        run: node scripts/verify_glaze_v1_7_1_development_boundary.mjs

      - name: Verify source checkout remains unchanged
        run: git diff --exit-code -- .
