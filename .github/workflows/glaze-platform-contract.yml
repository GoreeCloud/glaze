name: GLAZE UI Platform Contract 2.0

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-platform-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Legacy job id retained temporarily because the protected-main ruleset requires this exact status-check context.
  # The job now validates Platform Contract 2.0 and canonical Anchor semantics.
  platform-contract-0-4:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLATFORM_CONTRACT_SHA: 32cfe6395f6e4bc4872a99e8d0c666ea0b1ed7b8
    steps:
      - name: Check out exact Glaze UI revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact caller revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Fetch exact GoreeCloud Platform Contract
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/goreecloud-platform-contract"
          git init "$target"
          git -C "$target" remote add origin https://github.com/GoreeCloud/GoreeCloud.git
          git -C "$target" fetch --depth=1 origin "$PLATFORM_CONTRACT_SHA"
          git -C "$target" checkout --detach FETCH_HEAD
          test "$(git -C "$target" rev-parse HEAD)" = "$PLATFORM_CONTRACT_SHA"
          echo "PLATFORM_CONTRACT_ROOT=$target" >> "$GITHUB_ENV"

      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1

      - name: Validate Contract 2.0 declaration
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PLATFORM_CONTRACT_ROOT/scripts/validate_platform_manifest.py" goreecloud.platform.yaml
          python3 "$PLATFORM_CONTRACT_ROOT/scripts/evaluate_platform_conformance.py" \
            goreecloud.platform.yaml \
            --revision "$EXPECTED_SHA" \
            --evaluator-revision "$PLATFORM_CONTRACT_SHA" \
            --output goreecloud.conformance-result.json

      - name: Verify shared-library Anchor current-authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          manifest = yaml.safe_load(Path("goreecloud.platform.yaml").read_text(encoding="utf-8"))
          lifecycle = json.loads(Path("registry/lifecycle.json").read_text(encoding="utf-8"))
          result = json.loads(Path("goreecloud.conformance-result.json").read_text(encoding="utf-8"))

          assert manifest["component"]["type"] == "shared-library"
          assert manifest["component"]["repository"] == "GoreeCloud/glaze"
          assert manifest["schema_version"] == "2.0"
          assert manifest["lifecycle"] == "anchor"
          assert manifest["lifecycle_metadata"]["qualification_state"] == "passed"
          assert manifest["lifecycle_metadata"]["next_gate"] == "sunset"
          assert "acceptance/v1.7-stable.md" in manifest["lifecycle_metadata"]["evidence"]
          assert manifest["version"] == "1.7.0"
          assert manifest["conformance"]["status"] == "conformant"
          assert manifest["conformance"]["validated_at"] is not None
          assert manifest["conformance"]["blockers"] == []
          assert manifest["external_dependencies"] == []
          assert manifest["compatibility"]["glaze_ui_required"] == "1.7.0"
          assert manifest["platform_systems"]["glaze_ui"]["result"] == "applicable-conformant"
          assert manifest["platform_systems"]["glaze_ui"]["version"] == "1.7.0"
          assert lifecycle["currentStable"] == "1.7.0"
          assert lifecycle["currentOfficial"] == "1.7.0"
          assert lifecycle["currentLifecycle"] == "anchor"
          assert lifecycle["lifecycleVocabulary"] == "goreecloud-release-lifecycle/v0.7"
          assert lifecycle["activeCandidate"] is None
          assert result["evaluated_revision"] == __import__("os").environ["EXPECTED_SHA"]
          assert result["evaluator_revision"] == __import__("os").environ["PLATFORM_CONTRACT_SHA"]
          assert result["declared_conformance"] == "conformant"
          assert result["computed_conformance"] == "conformant"
          assert result["anchor_eligible"] is True
          assert "stable_eligible" not in result
          assert result["blockers"] == []

          evidence_paths = set()
          for entry in manifest["platform_systems"].values():
              evidence_paths.update(entry.get("evidence", []))
          for entry in manifest["evidence"]["acceptance_tests"]:
              evidence_paths.add(entry["path"])
          for entry in manifest["evidence"]["release"]:
              evidence_paths.add(entry["path"])
          evidence_paths.update(manifest["conformance"]["evidence"])
          evidence_paths.update(manifest["lifecycle_metadata"]["evidence"])

          missing = sorted(path for path in evidence_paths if not Path(path).is_file())
          if missing:
              raise SystemExit("missing manifest evidence paths: " + ", ".join(missing))

          categories = {
              entry["category"]
              for entry in manifest["evidence"]["acceptance_tests"]
              if entry["result"] == "passed"
          }
          required = {
              "glaze-ui",
              "accessibility",
              "supported-platform",
              "security",
              "privacy",
              "documentation",
              "integration",
              "release",
          }
          assert required <= categories
          assert any(entry["result"] == "published" and entry["version"] == "1.6.0" for entry in manifest["evidence"]["release"])
          current_release = [entry for entry in manifest["evidence"]["release"] if entry["version"] == "1.7.0"]
          assert len(current_release) == 1 and current_release[0]["result"] == "unverified"
          assert current_release[0]["artifact_digest"] is None

          print("platform-contract: bounded Glaze V1.7 shared-library Anchor current-authority boundary validated")
          print("platform-contract: Anchor eligibility true under Contract 2.0 current Glaze target 1.7.0; V1.7 GitHub Release publication remains separately unclaimed")
          PY

      - name: Verify repository action integrity
        run: |
          python3 -m py_compile scripts/validate_github_actions_runtime_integrity.py
          python3 scripts/validate_github_actions_runtime_integrity.py

      - name: Upload exact-head Platform Contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-platform-contract-${{ env.EXPECTED_SHA }}
          path: goreecloud.conformance-result.json
          if-no-files-found: error
          retention-days: 90
