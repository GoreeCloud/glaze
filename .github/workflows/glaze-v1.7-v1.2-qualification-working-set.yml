name: Glaze V1.7 Retained V1.2 Qualification Working Set

on:
  pull_request:
    paths:
      - 'contracts/v1.7/qualification.v1.2.working-set.plan.json'
      - 'docs/v1.7/v1.2-qualification-working-set-dev47.contract.json'
      - 'scripts/assemble_glaze_v1_7_v1_2_qualification_working_set.mjs'
      - 'contracts/v1.7/qualification.v1.2.rendered.plan.json'
      - 'reference/v1.7/rendered-v1.2-qualification.html'
      - 'reference/v1.7/rendered-v1.2-*.mjs'
      - 'scripts/capture_glaze_v1_7_v1_2_rendered_qualification.py'
      - 'scripts/validate_glaze_v1_7_v1_2_rendered_qualification_harness.mjs'
      - '.github/workflows/glaze-v1.7-v1.2-qualification-working-set.yml'
      - 'CHANGELOGS.md'
      - 'IMPLEMENTED-FEATURES.md'
  push:
    branches:
      - main
    paths:
      - 'contracts/v1.7/qualification.v1.2.working-set.plan.json'
      - 'docs/v1.7/v1.2-qualification-working-set-dev47.contract.json'
      - 'scripts/assemble_glaze_v1_7_v1_2_qualification_working_set.mjs'
      - '.github/workflows/glaze-v1.7-v1.2-qualification-working-set.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-7-v1-2-working-set-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V17_SOURCE_SHA: 4b9d085a5177b96cc31d4270b38d792a59872e37

jobs:
  verify-working-set-tooling:
    name: Verify retained V1.2 qualification working-set tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tooling head and frozen source ancestry
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "${V17_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$V17_SOURCE_SHA" HEAD

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Validate working-set composition tooling
        run: |
          python -m json.tool contracts/v1.7/qualification.v1.2.working-set.plan.json >/dev/null
          python -m json.tool docs/v1.7/v1.2-qualification-working-set-dev47.contract.json >/dev/null
          node --check scripts/assemble_glaze_v1_7_v1_2_qualification_working_set.mjs
          node scripts/assemble_glaze_v1_7_v1_2_qualification_working_set.mjs --plan-only
          node scripts/validate_glaze_v1_7_v1_2_machine_qualification.mjs
          node scripts/validate_glaze_v1_7_v1_2_rendered_qualification_harness.mjs
          node scripts/validate_glaze_v1_7_v1_3_provenance_qualification.mjs
          node scripts/validate_glaze_v1_7_acceptance_development.mjs

      - run: git diff --exit-code -- .

  build-working-set:
    name: Build retained V1.2 exact-source qualification working set
    needs: verify-working-set-tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out frozen dev.47 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.V17_SOURCE_SHA }}
          path: _v17-source
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify source and tooling identities
        env:
          EXPECTED_TOOLING_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TOOLING_SHA"
          test "$(git -C _v17-source rev-parse HEAD)" = "$V17_SOURCE_SHA"
          git -C _v17-source diff --exit-code -- .

      - name: Assemble repository-local render root
        run: |
          set -euo pipefail
          rm -rf _v17-render-root
          mkdir -p _v17-render-root/reference/v1.7
          cp -a _v17-source/js _v17-render-root/js
          cp -a _v17-source/css _v17-render-root/css
          cp reference/v1.7/rendered-v1.2-qualification.html _v17-render-root/reference/v1.7/rendered-v1.2-qualification.html
          cp reference/v1.7/rendered-v1.2-qualification.mjs _v17-render-root/reference/v1.7/rendered-v1.2-qualification.mjs
          cp reference/v1.7/rendered-v1.2-qualification-shared.mjs _v17-render-root/reference/v1.7/rendered-v1.2-qualification-shared.mjs
          cp reference/v1.7/rendered-v1.2-scenes-*.mjs _v17-render-root/reference/v1.7/
          test -f _v17-render-root/js/glaze-v1.7-development-v1-3.dev.mjs
          test -f _v17-render-root/reference/v1.7/rendered-v1.2-qualification.html
          test -f _v17-render-root/reference/v1.7/rendered-v1.2-qualification.mjs

      - name: Capture retained machine evidence
        run: |
          python scripts/capture_glaze_v1_7_v1_2_machine_qualification.py \
            --source-root _v17-source \
            --tooling-root . \
            --out artifacts/v1.7-v1.2-working-set/machine

      - name: Capture exact-source rendered browser evidence
        run: |
          python scripts/capture_glaze_v1_7_v1_2_rendered_qualification.py \
            --render-root _v17-render-root \
            --source-root _v17-source \
            --tooling-root . \
            --out artifacts/v1.7-v1.2-working-set/rendered

      - name: Capture deterministic provenance evidence twice
        run: |
          set -euo pipefail
          rm -rf artifacts/v1.7-v1.2-working-set/provenance "$RUNNER_TEMP/v17-working-set-provenance-second"
          mkdir -p artifacts/v1.7-v1.2-working-set/provenance "$RUNNER_TEMP/v17-working-set-provenance-second"
          python scripts/capture_glaze_v1_7_v1_3_provenance.py \
            --source-root _v17-source \
            --tooling-root . \
            --out artifacts/v1.7-v1.2-working-set/provenance
          python scripts/capture_glaze_v1_7_v1_3_provenance.py \
            --source-root _v17-source \
            --tooling-root . \
            --out "$RUNNER_TEMP/v17-working-set-provenance-second"
          for name in \
            glaze-v1.7.0-dev.47-source-qualification.tar.gz \
            provenance.json \
            v12-provenance-evidence.json \
            section48-provenance-evidence.json \
            SHA256SUMS \
            summary.json; do
            cmp "artifacts/v1.7-v1.2-working-set/provenance/$name" "$RUNNER_TEMP/v17-working-set-provenance-second/$name"
          done

      - name: Assemble retained V1.2 qualification working set
        run: |
          node scripts/assemble_glaze_v1_7_v1_2_qualification_working_set.mjs \
            --machine artifacts/v1.7-v1.2-working-set/machine/machine-evidence.json \
            --rendered artifacts/v1.7-v1.2-working-set/rendered \
            --provenance artifacts/v1.7-v1.2-working-set/provenance/v12-provenance-evidence.json \
            --out artifacts/v1.7-v1.2-working-set/working-set

      - name: Verify fail-closed matrix outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/v1.7-v1.2-working-set/working-set')
          manifest=json.loads((root/'manifest.json').read_text())
          summary=json.loads((root/'matrix-summary.json').read_text())
          combined=json.loads((root/'combined-evidence.json').read_text())
          assert manifest['sourceRevision']=='4b9d085a5177b96cc31d4270b38d792a59872e37'
          assert manifest['sourceModelVersion']=='1.7.0-dev.47'
          assert manifest['acceptanceModelVersion']=='1.7.0-dev.39'
          assert manifest['matrixExternallyVerifiedCount']==16
          assert manifest['matrixUnverifiedCount']==21
          assert manifest['evidenceInventoryComplete'] is False
          assert manifest['readyForGovernedQualificationReview'] is False
          assert summary['evidenceRecordCounts']=={'machine':20,'rendered':22,'provenance':1,'combined':43}
          assert summary['matrix']['externallyVerifiedCount']==16
          assert sorted(summary['matrix']['externallyVerifiedLaneIds'])==sorted([
              'task-continuity','adaptive-composition','semantic-color','theme-safety',
              'custom-theme-accessibility','signature-motion','connected-transformations',
              'animation-interruption','animation-reversal','reduced-motion',
              'reduced-transparency','increased-contrast','forced-colors','large-text','rtl',
              'artifact-provenance'
          ])
          assert summary['matrix']['unverifiedCount']==21
          assert summary['matrix']['evidenceInventoryComplete'] is False
          assert len(combined)==43
          assert manifest['authority']['workingSetOnly'] is True
          for key in (
              'governedReviewAcceptanceClaimed','section46CompleteClaimed','v17AcceptanceClaimed',
              'anchorStatusGranted','consumerEligibilityGranted','deploymentAcceptanceGranted',
              'productionAcceptanceGranted','lifecyclePromotionAutomatic'
          ):
              assert manifest['authority'][key] is False, key
          print('Retained V1.2 qualification working-set verification: PASS')
          PY
          git -C _v17-source diff --exit-code -- .
          git diff --exit-code -- .

      - name: Upload retained V1.2 qualification working set
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: glaze-v1.7-v1.2-working-set-${{ github.run_id }}
          path: artifacts/v1.7-v1.2-working-set/
          if-no-files-found: error
          retention-days: 90
